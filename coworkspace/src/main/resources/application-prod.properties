spring.application.name=coworkspace

# Production PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive schema policy: validate existing tables against JPA mappings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

server.port=${PORT:8080}

# JWT config - strictly required from environment in production
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed credentials (optional in production, only seeds if explicitly supplied)
admin.seed.email=${ADMIN_EMAIL:}
admin.seed.password=${ADMIN_PASSWORD:}

# Swagger UI paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# OTP & Abuse Prevention Configuration
otp.provider=${OTP_PROVIDER:TWILIO}
otp.mock.expose-code=false
otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}
otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
otp.hourly-limit-per-phone=${OTP_HOURLY_LIMIT_PHONE:3}
otp.hourly-limit-per-ip=${OTP_HOURLY_LIMIT_IP:10}
otp.hmac.secret=${OTP_HMAC_SECRET}

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}
