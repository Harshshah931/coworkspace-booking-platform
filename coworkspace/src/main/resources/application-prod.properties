spring.application.name=coworkspace

# Production PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive schema policy: validate existing tables against JPA mappings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

server.port=${PORT:8080}

# JWT config - strictly required from environment in production
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed credentials (optional in production, only seeds if explicitly supplied)
admin.seed.email=${ADMIN_EMAIL:}
admin.seed.password=${ADMIN_PASSWORD:}

# Swagger UI paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
