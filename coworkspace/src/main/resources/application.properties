spring.application.name=coworkspace

# H2 file-based database (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/coworkdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT and administrator seed credentials are supplied by the active profile.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

admin.seed.email=${ADMIN_EMAIL:}
admin.seed.password=${ADMIN_PASSWORD:}

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# OTP & Abuse Prevention Configuration
otp.provider=${OTP_PROVIDER:MOCK}
otp.mock.expose-code=false
otp.cooldown-seconds=60
otp.expiration-seconds=300
otp.max-attempts=3
otp.hourly-limit-per-phone=3
otp.hourly-limit-per-ip=10

# Twilio Configuration (Active when OTP_PROVIDER=TWILIO)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}
