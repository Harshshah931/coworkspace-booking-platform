spring.application.name=coworkspace

# H2 file-based database (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/coworkdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT config
# Reads from environment variable JWT_SECRET if set, otherwise falls back to
# a default value so the app still runs out-of-the-box for local development.
# For real deployment, always set JWT_SECRET as an actual environment variable.
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production-min-256-bits-long}
jwt.expiration-ms=86400000

# Admin seed credentials (used only by DataSeeder on first run)
# Reads from environment variables if set, otherwise uses these local defaults.
admin.seed.email=${ADMIN_EMAIL:admin@coworkspace.com}
admin.seed.password=${ADMIN_PASSWORD:admin123}

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
