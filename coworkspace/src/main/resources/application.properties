spring.application.name=coworkspace

# H2 file-based database (persists across restarts)
# Data is stored in a file called coworkdb.mv.db inside the project root
spring.datasource.url=jdbc:h2:file:./data/coworkdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update instead of create-drop: keeps existing data, only adds new columns/tables when the code changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT config
jwt.secret=coworkspaceSuperSecretKeyForJwtSigningChangeInProdMinimum256BitsLong
jwt.expiration-ms=86400000

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
