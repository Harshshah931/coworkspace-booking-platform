# Test-only configuration. Never use the persistent developer database during tests.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# Test-only signing keys; these values must never be used outside automated tests.
jwt.secret=CoWorkSpace-test-jwt-secret-should-never-be-used-in-production-2026
jwt.expiration-ms=3600000

# Disable optional admin seeding during tests.
admin.seed.email=
admin.seed.password=
