<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CoWorkSpace — Space Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F4F5FB; }
  .seat-map-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 0.75rem; }
  @media (max-width: 640px) { .seat-map-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
</style>
</head>
<body class="text-[#1B1C29]">

<header class="bg-white border-b border-gray-100 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="browse.html" class="font-bold text-xl text-[#2D3FE2]">CoWorkSpace</a>
    <div class="flex items-center gap-4">
      <a class="bg-[#2D3FE2] text-white px-4 py-2 rounded-lg font-medium hover:opacity-90 transition-opacity" href="my-bookings.html">My Bookings</a>
      <a class="text-gray-500 hover:text-[#2D3FE2] transition-colors" href="browse.html" title="Back to browse">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <button class="text-gray-500 hover:text-[#2D3FE2]" id="logout-btn" title="Log out">
        <span class="material-symbols-outlined text-[20px]">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

  <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-bold" id="space-name">Loading space...</h1>
      <p class="text-gray-500 mt-1 flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">location_on</span>
        <span id="space-location"></span>
      </p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm">
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="text-xs text-gray-500 block mb-1">Start date</label>
          <input class="border border-gray-200 rounded-lg px-3 py-2 text-sm" id="start-date" type="date"/>
        </div>
        <div>
          <label class="text-xs text-gray-500 block mb-1">End date</label>
          <input class="border border-gray-200 rounded-lg px-3 py-2 text-sm" id="end-date" type="date"/>
        </div>
        <button class="mt-5 px-4 py-2 bg-[#2D3FE2] text-white rounded-lg text-sm font-medium hover:opacity-90 transition-all" id="check-availability-btn">Check Availability</button>
      </div>
      <p class="text-xs text-gray-400 mt-2" id="date-hint"></p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-lg">Floor Plan</h2>
          <div class="flex gap-4 text-xs text-gray-500">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-100 border border-green-400 inline-block"></span> Available</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-gray-200 border border-gray-300 inline-block"></span> Booked</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-[#2D3FE2] inline-block"></span> Your Selection</span>
          </div>
        </div>

        <div class="seat-map-grid p-4 bg-[#FAFAFF] rounded-lg border border-dashed border-gray-200" id="seat-map-grid">
          <p class="col-span-6 text-center text-gray-500 py-8" id="seat-map-status">Pick your dates and check availability to see the seat map.</p>
        </div>
      </div>
    </div>

    <div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 sticky top-24">
        <h2 class="font-bold text-lg mb-4 pb-4 border-b border-gray-100">Booking Summary</h2>

        <div id="booking-summary-body" class="space-y-4">
          <p class="text-gray-500 text-sm">Select a seat on the map to begin.</p>
        </div>

        <div class="hidden mt-4" id="booking-type-toggle">
          <label class="text-xs text-gray-500 block mb-2">Booking type</label>
          <div class="flex gap-2">
            <button class="flex-1 py-2 rounded-lg border border-[#2D3FE2] text-[#2D3FE2] text-sm font-medium booking-type-btn" data-type="DAILY">Daily</button>
            <button class="flex-1 py-2 rounded-lg border border-gray-200 text-gray-500 text-sm font-medium booking-type-btn" data-type="MONTHLY">Monthly</button>
          </div>
        </div>

        <div class="hidden mt-4 pt-4 border-t border-dashed border-gray-200" id="booking-summary-totals">
          <div class="flex justify-between text-gray-500 text-sm">
            <span>Rate</span>
            <span id="summary-rate">—</span>
          </div>
          <div class="flex justify-between font-bold text-lg mt-2 pt-2 border-t border-gray-100">
            <span>Total</span>
            <span id="summary-total">$0.00</span>
          </div>
        </div>

        <button class="w-full mt-6 bg-[#2D3FE2] text-white py-3.5 rounded-xl font-semibold hover:opacity-95 transition-all shadow-lg shadow-[#2D3FE2]/20 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed" disabled id="confirm-booking-btn">
          Confirm Booking
        </button>
        <p class="text-center text-gray-400 text-xs mt-3" id="booking-msg">No charge until confirmation</p>
      </div>
    </div>

  </div>
</main>

<script src="api.js"></script>
<script>
    Auth.requireLogin();

    const params = new URLSearchParams(window.location.search);
    const spaceId = params.get('spaceId');

    if (!spaceId) {
        window.location.href = 'browse.html';
    }

    let currentSpace = null;
    let selectedSeatUnit = null; // { id, label, type, pricePerDay, pricePerMonth }
    let bookingType = 'DAILY';

    function todayStr(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().split('T')[0];
    }

    function addMonths(dateStr, months) {
        const d = new Date(dateStr);
        d.setMonth(d.getMonth() + months);
        return d.toISOString().split('T')[0];
    }

    // Sets sensible default dates depending on booking type, WITHOUT overriding
    // dates the user already chose deliberately (only applied on type switch
    // when the current range looks like a leftover default from the other type).
    function applyDefaultDatesForType(type) {
        const startInput = document.getElementById('start-date');
        const endInput = document.getElementById('end-date');
        const hint = document.getElementById('date-hint');

        if (type === 'MONTHLY') {
            hint.textContent = 'Monthly bookings default to a 1-month window — adjust the end date for longer stays.';
            if (!startInput.value) startInput.value = todayStr(1);
            endInput.value = addMonths(startInput.value, 1);
        } else {
            hint.textContent = 'Daily bookings are charged per day — pick any date range.';
            if (!startInput.value) startInput.value = todayStr(1);
            if (!endInput.value || endInput.value <= startInput.value) {
                endInput.value = todayStr(2); // sensible 1-day-minimum default, not a forced 3-day minimum
            }
        }
    }

    function renderSeatMap(seatUnits) {
        const grid = document.getElementById('seat-map-grid');
        grid.innerHTML = '';

        if (seatUnits.length === 0) {
            grid.innerHTML = '<p class="col-span-6 text-center text-gray-500 py-8">No seat units configured for this space yet.</p>';
            return;
        }

        seatUnits.forEach(su => {
            const div = document.createElement('div');
            const isCabin = su.type === 'CABIN';
            const priceLabel = bookingType === 'MONTHLY'
                ? `$${su.pricePerMonth}/mo`
                : `$${su.pricePerDay}/day`;

            if (!su.available) {
                div.className = 'p-3 bg-gray-100 border border-gray-200 text-gray-400 rounded-lg cursor-not-allowed flex flex-col items-center justify-center gap-1' + (isCabin ? ' col-span-2' : '');
                div.innerHTML = `<span class="material-symbols-outlined text-[18px]">block</span><span class="text-[10px] font-medium">${su.label}</span>`;
            } else {
                div.className = 'p-3 bg-white border border-green-300 text-green-700 rounded-lg cursor-pointer hover:bg-green-50 transition-all flex flex-col items-center justify-center gap-1' + (isCabin ? ' col-span-2' : '');
                div.innerHTML = isCabin
                    ? `<span class="material-symbols-outlined text-[18px]">meeting_room</span><span class="text-[10px] font-bold">${su.label}</span><span class="text-[9px] text-gray-500">${priceLabel}</span>`
                    : `<span class="material-symbols-outlined text-[18px]">desk</span><span class="text-[10px] font-bold">${su.label}</span><span class="text-[9px] text-gray-500">${priceLabel}</span>`;
                div.dataset.seatId = su.id;
                div.dataset.label = su.label;
                div.dataset.type = su.type;
                div.dataset.pricePerDay = su.pricePerDay;
                div.dataset.pricePerMonth = su.pricePerMonth;
                div.addEventListener('click', () => selectSeat(su, div));
            }
            grid.appendChild(div);
        });
    }

    function selectSeat(su, div) {
        document.querySelectorAll('#seat-map-grid > div[data-seat-id]').forEach(d => {
            const isCabin = d.dataset.type === 'CABIN';
            const priceLabel = bookingType === 'MONTHLY' ? `$${d.dataset.pricePerMonth}/mo` : `$${d.dataset.pricePerDay}/day`;
            d.className = 'p-3 bg-white border border-green-300 text-green-700 rounded-lg cursor-pointer hover:bg-green-50 transition-all flex flex-col items-center justify-center gap-1' + (isCabin ? ' col-span-2' : '');
            d.innerHTML = isCabin
                ? `<span class="material-symbols-outlined text-[18px]">meeting_room</span><span class="text-[10px] font-bold">${d.dataset.label}</span><span class="text-[9px] text-gray-500">${priceLabel}</span>`
                : `<span class="material-symbols-outlined text-[18px]">desk</span><span class="text-[10px] font-bold">${d.dataset.label}</span><span class="text-[9px] text-gray-500">${priceLabel}</span>`;
        });

        const isCabin = su.type === 'CABIN';
        div.className = 'p-3 bg-[#2D3FE2]/10 border-2 border-[#2D3FE2] text-[#2D3FE2] rounded-lg cursor-pointer flex flex-col items-center justify-center gap-1 shadow-sm' + (isCabin ? ' col-span-2' : '');
        div.innerHTML = `<span class="material-symbols-outlined text-[18px]">check_circle</span><span class="text-[10px] font-bold">${su.label}</span>`;

        selectedSeatUnit = su;
        updateSummary();
    }

    function updateSummary() {
        const summaryBody = document.getElementById('booking-summary-body');
        const totalsBlock = document.getElementById('booking-summary-totals');
        const typeToggle = document.getElementById('booking-type-toggle');
        const confirmBtn = document.getElementById('confirm-booking-btn');

        if (!selectedSeatUnit) {
            summaryBody.innerHTML = '<p class="text-gray-500 text-sm">Select a seat on the map to begin.</p>';
            totalsBlock.classList.add('hidden');
            typeToggle.classList.add('hidden');
            confirmBtn.disabled = true;
            return;
        }

        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const days = Math.max(1, Math.round((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)));

        let price, rateLabel;
        if (bookingType === 'MONTHLY') {
            const months = Math.max(1, Math.round(days / 30));
            price = parseFloat(selectedSeatUnit.pricePerMonth) * months;
            rateLabel = `$${selectedSeatUnit.pricePerMonth}/month × ${months}`;
        } else {
            price = parseFloat(selectedSeatUnit.pricePerDay) * days;
            rateLabel = `$${selectedSeatUnit.pricePerDay}/day × ${days}`;
        }

        summaryBody.innerHTML = `
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#2D3FE2]/10 rounded-lg flex items-center justify-center text-[#2D3FE2]">
                    <span class="material-symbols-outlined">${selectedSeatUnit.type === 'CABIN' ? 'meeting_room' : 'desk'}</span>
                </div>
                <div>
                    <p class="font-medium text-sm">${selectedSeatUnit.label}</p>
                    <p class="text-gray-500 text-xs">${currentSpace.name}</p>
                </div>
            </div>
            <div class="flex items-center gap-3 py-2">
                <span class="material-symbols-outlined text-gray-400">calendar_month</span>
                <div>
                    <p class="font-medium text-sm">${start} to ${end}</p>
                    <p class="text-gray-500 text-xs">${days} Day${days === 1 ? '' : 's'}</p>
                </div>
            </div>
        `;

        document.getElementById('summary-rate').textContent = rateLabel;
        document.getElementById('summary-total').textContent = `$${price.toFixed(2)}`;

        totalsBlock.classList.remove('hidden');
        typeToggle.classList.remove('hidden');
        confirmBtn.disabled = false;
    }

    async function loadSpaceInfo() {
        currentSpace = await Api.getSpace(spaceId);
        document.getElementById('space-name').textContent = currentSpace.name;
        document.getElementById('space-location').textContent = currentSpace.location;
    }

    async function checkAvailability() {
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const grid = document.getElementById('seat-map-grid');

        if (!start || !end) {
            alert('Please choose both start and end dates.');
            return;
        }
        if (start >= end) {
            alert('Start date must be before end date.');
            return;
        }

        grid.innerHTML = '<p class="col-span-6 text-center text-gray-500 py-8">Loading seat map...</p>';
        selectedSeatUnit = null;
        updateSummary();

        try {
            const availability = await Api.getAvailability(spaceId, start, end);
            renderSeatMap(availability.seatUnits);
        } catch (err) {
            grid.innerHTML = `<p class="col-span-6 text-center text-red-600 py-8">${err.message}</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());

        applyDefaultDatesForType('DAILY');

        document.getElementById('check-availability-btn').addEventListener('click', checkAvailability);

        document.querySelectorAll('.booking-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                bookingType = btn.dataset.type;
                document.querySelectorAll('.booking-type-btn').forEach(b => {
                    b.className = 'flex-1 py-2 rounded-lg border border-gray-200 text-gray-500 text-sm font-medium booking-type-btn';
                });
                btn.className = 'flex-1 py-2 rounded-lg border border-[#2D3FE2] text-[#2D3FE2] text-sm font-medium booking-type-btn';

                // Re-apply sensible defaults for the new type (e.g. monthly -> +1 month window)
                applyDefaultDatesForType(bookingType);
                updateSummary();
                checkAvailability(); // re-check since date range changed
            });
        });

        document.getElementById('confirm-booking-btn').addEventListener('click', async () => {
            if (!selectedSeatUnit) return;

            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            const confirmBtn = document.getElementById('confirm-booking-btn');
            const msg = document.getElementById('booking-msg');

            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Booking...';
            msg.textContent = '';
            msg.classList.remove('text-red-600');

            try {
                await Api.createBooking({
                    seatUnitId: selectedSeatUnit.id,
                    startDate: start,
                    endDate: end,
                    bookingType: bookingType,
                });
                window.location.href = 'my-bookings.html';
            } catch (err) {
                msg.textContent = err.message;
                msg.classList.add('text-red-600');
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Confirm Booking';
                checkAvailability();
            }
        });

        loadSpaceInfo().then(checkAvailability);
    });
</script>
</body></html>
