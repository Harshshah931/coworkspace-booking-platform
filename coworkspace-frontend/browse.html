<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CoWorkSpace — Browse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F4F5FB; }
  .glass-effect { background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); }
</style>
</head>
<body class="text-[#1B1C29]">

<header class="bg-white border-b border-gray-100 sticky top-0 z-40" id="site-header">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <a href="browse.html" class="font-bold text-xl text-[#2D3FE2]">CoWorkSpace</a>
    <nav class="hidden md:flex items-center gap-6 text-sm text-gray-500">
      <a href="browse.html" class="text-[#2D3FE2] font-medium">Browse</a>
      <a href="#" class="hover:text-[#2D3FE2]">Memberships</a>
      <a href="#" class="hover:text-[#2D3FE2]">Support</a>
    </nav>
    <div class="flex items-center gap-4" id="user-menu">
      <a href="my-bookings.html" class="hidden sm:block bg-[#2D3FE2] text-white px-5 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">My Bookings</a>
      <a href="profile.html" class="text-sm text-gray-500 hover:text-[#2D3FE2]" id="user-name-label"></a>
      <button class="text-gray-500 hover:text-[#2D3FE2]" id="logout-btn" title="Log out">
        <span class="material-symbols-outlined text-[20px]">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-2 flex flex-col md:flex-row gap-2 mb-8">
    <div class="flex-1 flex items-center px-4 gap-3 border-r border-gray-100">
      <span class="material-symbols-outlined text-[#2D3FE2]">search</span>
      <input class="w-full bg-transparent border-none focus:ring-0 text-sm" id="search-name" placeholder="Find a workspace..." type="text"/>
    </div>
    <div class="flex-1 flex items-center px-4 gap-3">
      <span class="material-symbols-outlined text-[#2D3FE2]">location_on</span>
      <input class="w-full bg-transparent border-none focus:ring-0 text-sm" id="search-location" placeholder="Any location" type="text"/>
    </div>
    <button class="bg-[#2D3FE2] text-white px-8 py-3 rounded-lg text-sm font-medium hover:opacity-95 transition-opacity" id="search-btn">Search</button>
  </div>

  <div class="mb-6">
    <h2 class="text-2xl font-bold">Available Spaces</h2>
    <p class="text-gray-500 text-sm mt-1" id="results-count">Loading spaces...</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="spaces-grid"></div>
  <div class="hidden text-center py-16" id="empty-state">
    <p class="text-xl font-bold text-gray-500">No spaces found</p>
    <p class="text-gray-400 mt-2">Try adjusting your search.</p>
  </div>

</main>

<script src="api.js"></script>
<script>
    Auth.requireLogin();

    const FALLBACK_IMAGES = [
        "https://lh3.googleusercontent.com/aida-public/AB6AXuB9w27_upfpwxABs-1EY0jt97bJb2w4O__5KG0fexwnX4nSOhGxd9tEtu0nUx5mVFanBwXWsK-fxZIwFt7EiEt-k1bFeW9s8MOL5y3eqKC_TrvtE7fHMFSDiIBjtHqpKIOlRd3BVUVjFBKOMrJtuCghWSVZ4LO0OFKzD-FaypY2l8kJrtbl7LODkW7JsYDBKrDhIQ4JNRFO8zro-8mOY-tBIcfi1JeIVRNjiqSlQ0QGL4oZ641RbxBz",
        "https://lh3.googleusercontent.com/aida-public/AB6AXuCoqUji9y_OD83vx2dufhvps-4K4z0BpsQ0xWzX8SX_SYwkhpbbTWSRsUTQrxzn-kMtTCfkSmR0Pb4F11IYkrZAsa2--CviFzvvxGAgXKJukLXHpF79cbQZq-Ri_B-dWOjWGRBaHoUQkCESAHpnpZyDskt94QRTnzd6ioqdk5DGpALJv1v_NmkQxzy4gyXsYETcIGZrqAlC3C5sAhH7qBMVUhP7PvVSRwueIS9S9a4tMOoYUmh026xC",
        "https://lh3.googleusercontent.com/aida-public/AB6AXuDjYZCADSka7AUhaRNcLi-CXPnSRJLp8y8ILn_rjvVsvrL98HpGvU1lC2ZJitHpbemwCii5r6KsZWKLdr6aSY9EKvxp5VCvMMc7nv6z-D-tFtkmNzPTuSTqOfW4VfpZTFJH69bHNWDvXBIQJroEJMLz12shN5hss81yB515ZUbxRpxskMkFmw4_j-Tm_JW3DLYSz5-PSG68jNpg7dBNdv4jwur0evESjTFq-OedXo_EJfZF27XZpIOq",
    ];

    let allSpaces = [];

    function renderSpaces(spaces) {
        const grid = document.getElementById('spaces-grid');
        const emptyState = document.getElementById('empty-state');
        const countLabel = document.getElementById('results-count');

        grid.innerHTML = '';

        if (spaces.length === 0) {
            emptyState.classList.remove('hidden');
            countLabel.textContent = '0 spaces found';
            return;
        }
        emptyState.classList.add('hidden');
        countLabel.textContent = `${spaces.length} space${spaces.length === 1 ? '' : 's'} found`;

        spaces.forEach((space, i) => {
            const img = FALLBACK_IMAGES[i % FALLBACK_IMAGES.length];
            const card = document.createElement('div');
            card.className = "group bg-white rounded-xl border border-gray-100 overflow-hidden shadow-sm hover:shadow-md transition-all duration-300";
            card.innerHTML = `
                <div class="relative h-48 w-full overflow-hidden">
                    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${img}"/>
                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-medium text-[#2D3FE2] shadow-sm">
                        ${space.type === 'CABIN' ? 'Private Cabin' : 'Desk Space'}
                    </div>
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-lg">${space.name}</h3>
                    <div class="flex items-center gap-1 text-gray-500 text-sm mt-1 mb-3">
                        <span class="material-symbols-outlined text-[16px]">location_on</span>
                        <span>${space.location}</span>
                    </div>
                    <div class="mb-4">
                        <p class="text-[#2D3FE2] font-bold text-lg">${formatINR(space.pricePerDay)}<span class="text-gray-400 font-normal text-sm">/day</span></p>
                        <p class="text-gray-400 text-xs mt-1">${space.totalSeatUnits} seat unit${space.totalSeatUnits === 1 ? '' : 's'} • cabin prices may vary</p>
                    </div>
                    <button class="w-full bg-[#2D3FE2] text-white py-2.5 rounded-lg text-sm font-medium hover:opacity-90 transition-all view-availability-btn" data-space-id="${space.id}">
                        View Availability
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        document.querySelectorAll('.view-availability-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                window.location.href = `space-detail.html?spaceId=${btn.dataset.spaceId}`;
            });
        });
    }

    function applyFilters() {
        const nameQuery = document.getElementById('search-name').value.trim().toLowerCase();
        const locationQuery = document.getElementById('search-location').value.trim().toLowerCase();

        const filtered = allSpaces.filter(s => {
            const matchesName = !nameQuery || s.name.toLowerCase().includes(nameQuery);
            const matchesLocation = !locationQuery || s.location.toLowerCase().includes(locationQuery);
            return matchesName && matchesLocation;
        });

        renderSpaces(filtered);
    }

    async function loadSpaces() {
        const countLabel = document.getElementById('results-count');
        try {
            allSpaces = await Api.getSpaces();
            renderSpaces(allSpaces);
        } catch (err) {
            countLabel.textContent = 'Could not load spaces. Is the backend running on localhost:8080?';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = Auth.getUser();
        if (user) document.getElementById('user-name-label').textContent = user.name;

        document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());
        document.getElementById('search-btn').addEventListener('click', applyFilters);
        document.getElementById('search-name').addEventListener('keyup', (e) => { if (e.key === 'Enter') applyFilters(); });
        document.getElementById('search-location').addEventListener('keyup', (e) => { if (e.key === 'Enter') applyFilters(); });

        loadSpaces();
    });
</script>
</body></html>
